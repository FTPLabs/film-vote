openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Film Vote — Russian anonymous movie voting app
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movies
    description: Movie operations
  - name: votes
    description: Voting operations
  - name: admin
    description: Admin operations
  - name: stats
    description: Statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /movies:
    get:
      operationId: listMovies
      tags: [movies]
      summary: List all movies with vote stats
      responses:
        "200":
          description: List of movies with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovieWithStats"
    post:
      operationId: createMovie
      tags: [admin]
      summary: Create a new movie (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
      responses:
        "201":
          description: Movie created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          description: Unauthorized

  /movies/{id}:
    get:
      operationId: getMovie
      tags: [movies]
      summary: Get single movie with stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Movie with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieWithStats"
        "404":
          description: Not found
    patch:
      operationId: updateMovie
      tags: [admin]
      summary: Update a movie (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoviePatch"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteMovie
      tags: [admin]
      summary: Delete a movie (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /movies/{id}/vote:
    get:
      operationId: getMyVote
      tags: [votes]
      summary: Get current user's vote for a movie (by IP)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User vote info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserVote"
    post:
      operationId: castVote
      tags: [votes]
      summary: Cast or update a vote for a movie
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteInput"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
        "400":
          description: Invalid vote
        "404":
          description: Movie not found

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get overall statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Movie:
      type: object
      required: [id, title, description, imageUrl, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        year:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    MovieInput:
      type: object
      required: [title, description, imageUrl]
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        year:
          type: ["number", "null"]

    MoviePatch:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        year:
          type: ["number", "null"]

    MovieWithStats:
      type: object
      required: [id, title, description, imageUrl, createdAt, totalVotes, forCount, neutralCount, againstCount, forPercent, neutralPercent, againstPercent, expectationPercent]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        year:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
        totalVotes:
          type: number
        forCount:
          type: number
        neutralCount:
          type: number
        againstCount:
          type: number
        forPercent:
          type: number
        neutralPercent:
          type: number
        againstPercent:
          type: number
        expectationPercent:
          type: number
          description: Same as forPercent, kept for backward compatibility
        userVote:
          type: ["string", "null"]
          description: "User's vote type: 'for', 'neutral', 'against', or null"

    VoteInput:
      type: object
      required: [voteType]
      properties:
        voteType:
          type: string
          enum: [for, neutral, against]

    VoteResult:
      type: object
      required: [movieId, voteType, isNew]
      properties:
        movieId:
          type: number
        voteType:
          type: string
          enum: [for, neutral, against]
        isNew:
          type: boolean
          description: True if this is a new vote, false if updated

    UserVote:
      type: object
      required: [movieId, voted]
      properties:
        movieId:
          type: number
        voted:
          type: boolean
        voteType:
          type: ["string", "null"]
          description: "User's vote type: 'for', 'neutral', 'against', or null"

    Stats:
      type: object
      required: [totalMovies, totalVotes, topMovies]
      properties:
        totalMovies:
          type: number
        totalVotes:
          type: number
        topMovies:
          type: array
          items:
            $ref: "#/components/schemas/MovieWithStats"
          description: Top 5 movies by "for" percentage

    AdminCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
