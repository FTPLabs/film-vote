openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Film Vote — Russian anonymous movie voting app
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movies
    description: Movie operations
  - name: votes
    description: Voting operations
  - name: admin
    description: Admin operations
  - name: stats
    description: Statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /movies:
    get:
      operationId: listMovies
      tags: [movies]
      summary: List all movies with vote stats
      responses:
        "200":
          description: List of movies with stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovieWithStats"
    post:
      operationId: createMovie
      tags: [admin]
      summary: Create a new movie (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
      responses:
        "201":
          description: Movie created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          description: Unauthorized

  /movies/{id}:
    get:
      operationId: getMovie
      tags: [movies]
      summary: Get single movie with stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Movie with stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieWithStats"
        "404":
          description: Not found
    patch:
      operationId: updateMovie
      tags: [admin]
      summary: Update a movie (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoviePatch"
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteMovie
      tags: [admin]
      summary: Delete a movie (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /movies/{id}/vote:
    get:
      operationId: getMyVote
      tags: [votes]
      summary: Get current user's vote for a movie (by IP)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: User vote or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserVote"
        "404":
          description: Movie not found
    post:
      operationId: castVote
      tags: [votes]
      summary: Cast or update vote for a movie (IP-limited to one vote per IP)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteInput"
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteResult"
        "400":
          description: Invalid score
        "404":
          description: Movie not found

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get overall voting stats (top movies, totals)
      responses:
        "200":
          description: Overall stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          description: Invalid password

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Movie:
      type: object
      required: [id, title, description, imageUrl, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        year:
          type: ["number", "null"]
        createdAt:
          type: string

    MovieWithStats:
      type: object
      required: [id, title, description, imageUrl, createdAt, totalVotes, expectationPercent, averageScore]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        year:
          type: ["number", "null"]
        createdAt:
          type: string
        totalVotes:
          type: number
        expectationPercent:
          type: number
          description: Average score as percentage (0–100)
        averageScore:
          type: number
          description: Average score (0–10)
        userVote:
          type: ["number", "null"]
          description: Current user's vote score (1–10), null if not voted

    MovieInput:
      type: object
      required: [title, description, imageUrl]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        imageUrl:
          type: string
        year:
          type: ["number", "null"]

    MoviePatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        imageUrl:
          type: string
        year:
          type: ["number", "null"]

    VoteInput:
      type: object
      required: [score]
      properties:
        score:
          type: number
          minimum: 1
          maximum: 10

    VoteResult:
      type: object
      required: [movieId, score, isNew]
      properties:
        movieId:
          type: number
        score:
          type: number
        isNew:
          type: boolean
          description: True if this is a new vote, false if updated

    UserVote:
      type: object
      required: [movieId, voted]
      properties:
        movieId:
          type: number
        voted:
          type: boolean
        score:
          type: ["number", "null"]

    Stats:
      type: object
      required: [totalMovies, totalVotes, topMovies]
      properties:
        totalMovies:
          type: number
        totalVotes:
          type: number
        topMovies:
          type: array
          items:
            $ref: "#/components/schemas/MovieWithStats"
          description: Top 5 movies by expectation percentage

    AdminCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
